[workspace]
resolver = "2"
members = ["crates/lumen"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Performance-first retained-mode GUI library for Rust"
keywords = ["gui", "ui", "wgpu", "retained", "tailwind"]
categories = ["gui"]

[workspace.dependencies]
wgpu = { version = "22", features = ["wgsl"] }
winit = { version = "0.30", default-features = false }
cosmic-text = "0.12"
mint = "0.5"
log = "0.4"
smol_str = "0.2"
hashbrown = "0.14"
ahash = "0.8"
rustc-hash = "2"
smallvec = "1"
bitflags = "2"
bytemuck = { version = "1", features = ["derive"] }
once_cell = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
[profile.dev]
opt-level = 1
