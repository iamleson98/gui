name: C++ CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install Linux dependencies
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y libx11-dev libgl1-mesa-dev
    
    - name: Build (Linux)
      if: runner.os == 'Linux'
      run: |
        cd cpp
        make clean
        make
    
    - name: Build (macOS)
      if: runner.os == 'macOS'
      run: |
        cd cpp
        make clean
        make || echo "Build may fail on macOS without Cocoa OpenGL bridge"
      continue-on-error: true
    
    - name: Run examples
      if: runner.os == 'Linux'
      run: |
        cd cpp
        ./counter || true
        ./gallery || true
      continue-on-error: true
