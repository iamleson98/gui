name: Rust CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy
    
    - name: Install Linux dependencies
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y libx11-dev libxkbcommon-dev libwayland-dev libgl1-mesa-dev
    
    - name: Check
      run: cargo check --lib --manifest-path rust/Cargo.toml
    
    - name: Check examples
      run: cargo check --examples --manifest-path rust/Cargo.toml
    
    - name: Run tests
      run: cargo test --lib --manifest-path rust/Cargo.toml
    
    - name: Clippy
      run: cargo clippy --lib --manifest-path rust/Cargo.toml -- -D warnings
      continue-on-error: true
